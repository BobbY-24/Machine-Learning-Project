name: notebook
on: [push, pull_request]
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt nbconvert ipykernel
      - run: jupyter nbconvert --to notebook --execute --output executed.ipynb postseason_classification.ipynb
